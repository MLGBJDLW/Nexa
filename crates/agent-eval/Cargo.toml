[package]
name = "nexa-agent-eval"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
nexa-core = { path = "../core", default-features = false }
async-trait = "0.1.92"
blake3 = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util", "net"] }
tokio-util = "0.7"

[dev-dependencies]

[build-dependencies]
blake3 = "1"

