[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/model-catalog",
    "crates/agent-eval",
    "crates/remote",
    "apps/desktop/src-tauri",
]

exclude = ["vendor/rust/*"]

[patch.crates-io]
calamine = { path = "vendor/rust/calamine" }
candle-core = { path = "vendor/rust/candle-core" }
github-copilot-sdk = { path = "vendor/rust/github-copilot-sdk" }
tauri-plugin-updater = { path = "vendor/rust/tauri-plugin-updater" }

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "MIT"

[profile.release]
lto = false
codegen-units = 16
strip = true
opt-level = 2

# Repeated local test builds otherwise retain large per-crate incremental graphs.
# Keep line tables for useful backtraces without full variable debug information.
[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.test]
incremental = false
debug = "line-tables-only"
