name: Configure Ubuntu APT
description: Prefer a reachable Ubuntu archive with independent mirror fallbacks.

runs:
  using: composite
  steps:
    - name: Configure Ubuntu archive
      shell: bash
      run: |
        source /etc/os-release
        mirror_file=/etc/apt/apt-mirrors.txt
        archives=(
          https://archive.ubuntu.com/ubuntu/
          http://azure.archive.ubuntu.com/ubuntu/
          https://mirrors.edge.kernel.org/ubuntu/
          https://security.ubuntu.com/ubuntu/
        )
        primary_archive=
        # Avoid paying the DNS/connection timeout for every package when the
        # preferred archive is unavailable. APT still handles later failover.
        for archive in "${archives[@]}"; do
          if curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 \
            "${archive}dists/${VERSION_CODENAME}/InRelease" --output /dev/null; then
            primary_archive="$archive"
            break
          fi
        done
        if [[ -z "$primary_archive" ]]; then
          echo "::error::No Ubuntu archive is reachable for ${VERSION_CODENAME}."
          exit 1
        fi
        {
          printf '%s\tpriority:1\n' "$primary_archive"
          for archive in "${archives[@]}"; do
            if [[ "$archive" != "$primary_archive" ]]; then
              printf '%s\tpriority:2\n' "$archive"
            fi
          done
        } | sudo tee "$mirror_file" >/dev/null

        source_files=(
          /etc/apt/sources.list
          /etc/apt/sources.list.d/ubuntu.sources
        )
        for source_file in "${source_files[@]}"; do
          if [[ -f "$source_file" ]]; then
            sudo sed -i \
              -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/\?|mirror+file:/etc/apt/apt-mirrors.txt|g' \
              -e 's|https://archive\.ubuntu\.com/ubuntu/\?|mirror+file:/etc/apt/apt-mirrors.txt|g' \
              "$source_file"
          fi
        done

        if [[ -f "$mirror_file" ]]; then
          echo "Ubuntu APT mirror list:"
          cat "$mirror_file"
        fi
