name: Configure Ubuntu APT
description: Prefer a reachable Ubuntu archive while retaining the hosted-runner mirror fallbacks.

runs:
  using: composite
  steps:
    - name: Configure Ubuntu archive
      shell: bash
      run: |
        source /etc/os-release
        mirror_file=/etc/apt/apt-mirrors.txt
        primary_archive=https://archive.ubuntu.com/ubuntu/
        fallback_archive=http://azure.archive.ubuntu.com/ubuntu/
        # Avoid paying the DNS/connection timeout for every package when the
        # preferred archive is unavailable. APT still handles later failover.
        if ! curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 \
          "${primary_archive}dists/${VERSION_CODENAME}/InRelease" --output /dev/null; then
          primary_archive=http://azure.archive.ubuntu.com/ubuntu/
          fallback_archive=https://archive.ubuntu.com/ubuntu/
        fi
        printf '%s\tpriority:1\n%s\tpriority:2\n%s\tpriority:3\n' \
          "$primary_archive" "$fallback_archive" 'https://security.ubuntu.com/ubuntu/' \
          | sudo tee "$mirror_file" >/dev/null

        source_files=(
          /etc/apt/sources.list
          /etc/apt/sources.list.d/ubuntu.sources
        )
        for source_file in "${source_files[@]}"; do
          if [[ -f "$source_file" ]]; then
            sudo sed -i \
              -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/\?|mirror+file:/etc/apt/apt-mirrors.txt|g' \
              -e 's|https://archive\.ubuntu\.com/ubuntu/\?|mirror+file:/etc/apt/apt-mirrors.txt|g' \
              "$source_file"
          fi
        done

        if [[ -f "$mirror_file" ]]; then
          echo "Ubuntu APT mirror list:"
          cat "$mirror_file"
        fi
