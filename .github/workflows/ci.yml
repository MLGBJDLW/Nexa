name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      target_sha:
        description: Immutable release candidate to validate with the full suite
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.target_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  classify:
    name: Classify CI Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_metadata_only: ${{ steps.scope.outputs.release_metadata_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.ref }}
          fetch-depth: 0

      - name: Classify trusted release metadata updates
        id: scope
        env:
          NEXA_CI_BASE_REF: origin/master
          NEXA_CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          NEXA_CI_HEAD_REF: HEAD
          NEXA_CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          NEXA_CI_TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$NEXA_CI_TARGET_SHA" ]; then
            if ! [[ "$NEXA_CI_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$NEXA_CI_TARGET_SHA" ]; then
              echo "::error::Release validation must check out the exact candidate SHA"
              exit 1
            fi
            echo "release_metadata_only=false" >> "$GITHUB_OUTPUT"
            echo "Full release validation: \`$NEXA_CI_TARGET_SHA\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch --no-tags origin master:refs/remotes/origin/master
          git diff --name-only "origin/master...HEAD" > /tmp/nexa-ci-changed-paths.txt
          release_metadata_only=$(node scripts/ci-scope.mjs < /tmp/nexa-ci-changed-paths.txt)
          echo "release_metadata_only=$release_metadata_only" >> "$GITHUB_OUTPUT"
          {
            echo "### CI scope"
            echo
            echo "Release metadata only: \`$release_metadata_only\`"
            echo
            sed 's/^/- `/' /tmp/nexa-ci-changed-paths.txt | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  # Verification jobs are split by dependency and failure domain so a native
  # package outage cannot prevent unrelated Rust or frontend feedback.
  repository_policy:
    name: Repository Policy
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify documentation links and schema index
        run: npm run docs:check

      - name: Reject tracked local workspace artifacts
        run: npm run repository:check

  release_metadata:
    name: Release Metadata Contracts
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify release and CI workflow contracts
        run: npm run release:workflow:test

      - name: Verify synchronized release metadata
        run: npm run release:metadata:test

  rust_core:
    name: Rust Core
    needs: classify
    if: needs.classify.outputs.release_metadata_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-nexa-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nexa-v1-

      - name: Cache ONNX Runtime
        uses: actions/cache@v5
        with:
          path: ~/.cache/ort.pyke.io
          key: ${{ runner.os }}-ort-${{ hashFiles('crates/core/Cargo.toml') }}

      - name: Install cargo-audit
        run: |
          if ! cargo audit --version 2>/dev/null | grep -q '0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: Rust dependency audit
        run: cargo audit

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy -p nexa-core -- -D warnings

      - name: Core feature boundary checks
        run: |
          cargo check -p nexa-core --no-default-features
          cargo check -p nexa-core --no-default-features --features local-embeddings
          cargo check -p nexa-core --no-default-features --features ocr
          cargo check -p nexa-core --no-default-features --features video

      - name: Agent eval smoke
        run: cargo test -p nexa-core developer_eval_smoke_workflow

      - name: Cargo test
        run: cargo test -p nexa-core

      - name: Remote protocol contracts
        run: |
          cargo clippy -p nexa-remote --all-targets -- -D warnings
          cargo test -p nexa-remote

  office_smoke:
    name: Office Artifact Smoke
    needs: classify
    if: needs.classify.outputs.release_metadata_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.424

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked PPTX author adapter
        run: npm ci --ignore-scripts

      - name: Verify release workflow recovery contract
        run: npm run release:workflow:test

      - name: Verify Office author supply chain and bundle closure
        run: |
          npm audit --audit-level=high
          npm run office:supply-chain:test
          npm run office:pptxgenjs:bundle
          test -f apps/desktop/src-tauri/resources/pptxgenjs-runtime/runtime-manifest.json

      - name: Verify Office.js add-in contract
        run: |
          npm run office:addin:test
          python3 integrations/office-addin/test_deployment.py -v

      - name: Build pinned Open XML SDK validator
        run: |
          dotnet restore tools/openxml-validator/Nexa.OpenXml.Validator.csproj --locked-mode
          dotnet publish tools/openxml-validator/Nexa.OpenXml.Validator.csproj -c Release --no-restore

      - name: Install Office smoke dependencies
        uses: ./.github/actions/install-ubuntu-packages
        timeout-minutes: 12
        with:
          packages: |
            libreoffice-writer
            libreoffice-calc
            libreoffice-impress
            poppler-utils

      - name: Office artifact runtime smoke
        env:
          NEXA_OPENXML_VALIDATOR: ${{ github.workspace }}/tools/openxml-validator/bin/Release/net8.0/publish/Nexa.OpenXml.Validator.dll
        run: |
          command -v soffice
          command -v pdftoppm
          soffice --headless --version
          pdftoppm -v
          python3 -m venv /tmp/nexa-office-venv
          /tmp/nexa-office-venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r crates/core/assets/skills/doc-script-editor/scripts/requirements.lock
          for suite in \
            crates/core/assets/skills/doc-script-editor/scripts \
            crates/core/assets/skills/docx-document-design/scripts \
            crates/core/assets/skills/xlsx-workbook-design/scripts \
            crates/core/assets/skills/pptx-presentation-design/scripts; do
            /tmp/nexa-office-venv/bin/python -m unittest discover -v -s "$suite" -p 'test_*.py'
          done

  frontend:
    name: Frontend Contracts & Build
    needs: classify
    if: needs.classify.outputs.release_metadata_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Root dependency audit
        run: npm audit --audit-level=moderate

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend dependency audit
        working-directory: apps/desktop
        run: npm audit --audit-level=moderate

      - name: Frontend streaming contracts
        working-directory: apps/desktop
        run: npm test

      - name: Model catalog static audit
        run: npm run catalog:audit

      - name: Model catalog audit fixtures
        run: npm run catalog:audit:test

      - name: TypeScript check
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Frontend build
        working-directory: apps/desktop
        run: npx vite build

  browser_regressions:
    name: Browser Regressions
    needs: classify
    if: needs.classify.outputs.release_metadata_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Match the locked Playwright version; avoid per-run Ubuntu mirror installs.
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Verify bundled Chromium
        working-directory: apps/desktop
        run: |
          node --input-type=module -e "import { chromium } from '@playwright/test'; import { accessSync } from 'node:fs'; accessSync(chromium.executablePath()); const browser = await chromium.launch(); await browser.close();"

      - name: Critical chat UI regressions
        working-directory: apps/desktop
        run: >-
          npx playwright test
          e2e/app-window-frame.spec.ts
          e2e/chat-conversation-archive.spec.ts
          e2e/chat-stream-markdown-throttle.spec.ts
          e2e/chat-stream-rounds.spec.ts
          e2e/chat-steering.spec.ts
          e2e/settings-update-panel.spec.ts
          e2e/chat-done-preview-persistence.spec.ts
          e2e/chat-mermaid-rendering.spec.ts
          e2e/chat-model-switch-context.spec.ts
          e2e/chat-browser-workspace.spec.ts
          e2e/browser-agent-interaction-runtime.spec.ts
          e2e/chat-terminal-dock.spec.ts
          e2e/chat-turn-navigation.spec.ts
          e2e/context-usage-persistence.spec.ts
          e2e/chat-plan-progress-panel.spec.ts
          e2e/chat-recording-dock.spec.ts
          e2e/settings-provider-models.spec.ts
          --grep "settings-update-panel|expanded settings keep compact|chat-steering|chat-mermaid-rendering|themed window frame|browser-agent-interaction-runtime|conversation actions offer archive and delete|conversation quick actions remain individually clickable|archived conversations can be restored|a direct archived conversation link|retries a persisted user message|edits a persisted user message through the durable retry boundary|restores the persisted reply suffix|reconciles the durable reply suffix|generates the initial empty chat title once|hydrates a paused run with its durable partial output|keeps long streaming markdown advancing|keeps sidebar interaction urgent|preserves multiple thinking and tool rounds|wraps an unbroken live thinking token|context HUD refreshes confirmed|live conversation cache totals|live cache refresh|Git capsule|browser action trail|model selector|shared Browser Workspace|interactive terminal dock|floating plan capsule|only the Plan capsule drags|Mermaid|hub labels inside nodes|theme CSS connector metrics|turn timeline|right-side timeline|sparse turn timeline|virtualizes a 10000-message conversation|file edit badges|recording dock exposes responsive|current Qwen3.8 Token Plan|public GLM-5.3 flagship|Meta Model API|Codex subscription account|Codex device-code|stale account refresh|GitHub Copilot subscription|Copilot CLI browser login"

      - name: App resources and agent browser competence
        working-directory: apps/desktop
        run: >-
          npx playwright test
          e2e/app-resource-lifecycle.spec.ts
          e2e/task-center.spec.ts
          e2e/browser-agent-competence.spec.ts
          e2e/browser-preview-rendering.spec.ts

      - name: Streaming scroll, questions, and desktop approval regressions
        working-directory: apps/desktop
        run: >-
          npx playwright test
          e2e/thinking-follow.spec.ts
          e2e/chat-scroll-behavior.spec.ts
          e2e/chat-decision-tray.spec.ts
          e2e/desktop-approval-scope.spec.ts
          e2e/desktop-control-status.spec.ts
          e2e/subagent-ui.spec.ts
          e2e/subagent-batch-judge-ui.spec.ts

      - name: Live, phone pairing, startup, and local preview regressions
        working-directory: apps/desktop
        run: >-
          npx playwright test
          e2e/live-observation.spec.ts
          e2e/remote-phone.spec.ts
          e2e/remote-setup.spec.ts
          e2e/file-preview-agent-edit.spec.ts
          e2e/chat-image-preview.spec.ts
          e2e/chat-managed-process.spec.ts
          e2e/knowledge-graph-filters.spec.ts
          e2e/knowledge-graph-dark-theme.spec.ts
          e2e/app-window-frame.spec.ts

      - name: Upload browser regression diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  linux_desktop:
    name: Linux Desktop Check
    needs: classify
    if: needs.classify.outputs.release_metadata_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.ref }}

      - name: Install Tauri system dependencies
        uses: ./.github/actions/install-ubuntu-packages
        timeout-minutes: 10
        with:
          packages: |
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            patchelf
            libssl-dev
            libgtk-3-dev
            libjavascriptcoregtk-4.1-dev
            libsoup-3.0-dev
            libdbus-1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-nexa-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nexa-v1-

      - name: Cache Copilot CLI runtime
        uses: actions/cache@v5
        with:
          path: target/copilot-cli-cache/
          key: ${{ runner.os }}-copilot-cli-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache ONNX Runtime
        uses: actions/cache@v5
        with:
          path: ~/.cache/ort.pyke.io
          key: ${{ runner.os }}-ort-${{ hashFiles('crates/core/Cargo.toml') }}

      - name: Prepare Tauri frontend stub
        shell: bash
        run: |
          mkdir -p apps/desktop/dist
          printf '%s\n' '<!doctype html><html></html>' > apps/desktop/dist/index.html

      - name: Desktop Rust check
        run: cargo check -p nexa-desktop

      - name: Desktop recovery and browser observation contracts
        run: >-
          cargo test -p nexa-desktop --no-default-features --bin nexa-desktop --
          desktop_agent_session::stop::
          completed_agent_appearance_reaches_native_change_notification
          browser::
          command_dispatch::tests::
          commands::terminal::tests::
          commands::update::tests::

  # Keep this name stable: callers and merge policy treat it as the public CI
  # interface while the implementation jobs above may evolve independently.
  check:
    name: Check & Lint
    if: ${{ always() }}
    needs:
      - classify
      - repository_policy
      - release_metadata
      - rust_core
      - office_smoke
      - frontend
      - browser_regressions
      - linux_desktop
      - windows-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI jobs
        env:
          RELEASE_METADATA_ONLY: ${{ needs.classify.outputs.release_metadata_only }}
          REPOSITORY_POLICY_RESULT: ${{ needs.repository_policy.result }}
          RELEASE_METADATA_RESULT: ${{ needs.release_metadata.result }}
          RUST_CORE_RESULT: ${{ needs.rust_core.result }}
          OFFICE_SMOKE_RESULT: ${{ needs.office_smoke.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_REGRESSIONS_RESULT: ${{ needs.browser_regressions.result }}
          LINUX_DESKTOP_RESULT: ${{ needs.linux_desktop.result }}
          WINDOWS_DESKTOP_RESULT: ${{ needs.windows-check.result }}
        shell: bash
        run: |
          if [ "$RELEASE_METADATA_ONLY" = "true" ]; then
            results=(
              "Repository Policy:$REPOSITORY_POLICY_RESULT"
              "Release Metadata Contracts:$RELEASE_METADATA_RESULT"
            )
          else
            results=(
              "Repository Policy:$REPOSITORY_POLICY_RESULT"
              "Release Metadata Contracts:$RELEASE_METADATA_RESULT"
              "Rust Core:$RUST_CORE_RESULT"
              "Office Artifact Smoke:$OFFICE_SMOKE_RESULT"
              "Frontend Contracts & Build:$FRONTEND_RESULT"
              "Browser Regressions:$BROWSER_REGRESSIONS_RESULT"
              "Linux Desktop Check:$LINUX_DESKTOP_RESULT"
              "Windows Desktop Check:$WINDOWS_DESKTOP_RESULT"
            )
          fi

          failed=0
          for result in "${results[@]}"; do
            echo "$result"
            if [[ "$result" != *":success" ]]; then
              failed=1
            fi
          done
          exit "$failed"

  windows-check:
    name: Windows Desktop Check
    needs: classify
    if: needs.classify.outputs.release_metadata_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-nexa-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nexa-v1-

      - name: Cache Copilot CLI runtime
        uses: actions/cache@v5
        with:
          path: target/copilot-cli-cache/
          key: ${{ runner.os }}-copilot-cli-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Prepare Tauri frontend stub
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/dist | Out-Null
          Set-Content -Path apps/desktop/dist/index.html -Value '<!doctype html><html></html>'

      - name: Desktop Rust check
        run: cargo check -p nexa-desktop

      - name: Windows terminal and browser contracts
        run: >-
          cargo test -p nexa-desktop --no-default-features --bin nexa-desktop --
          command_dispatch::tests::
          commands::terminal::tests::
          browser::agent_tool::tests::

      - name: Native PowerShell terminal input and paste
        shell: pwsh
        run: |
          $env:NEXA_TEST_PWSH = (Get-Command pwsh).Source
          cargo test -p nexa-desktop --no-default-features --bin nexa-desktop native_powershell_input_and_paste_keep_protocol_bytes -- --ignored --nocapture
